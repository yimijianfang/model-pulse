<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"><title>ModelPulse</title><link rel="stylesheet" href="styles.css"><script src="../../node_modules/echarts/dist/echarts.min.js"></script><script type="module" src="app.js"></script></head><body><div class="native-title" aria-hidden="true">ModelPulse</div>
<header class="windowbar"><div class="brand"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M2 17h6l4-10 7 20 4-10h7"/></svg>ModelPulse<span class="brand-description">模型管理与测速</span></div><div class="actions"><button id="scheduleOpen" class="quiet">设置计划</button><button id="settingsOpen" class="quiet">运行设置</button></div></header>
<main><div class="tabs"><button class="active" data-view="models">模型管理</button><button data-view="history">历史趋势</button><button data-view="notifications" id="notificationTab">通知</button></div>
<section id="modelsView"><div class="top"><div><h1>模型管理</h1></div><div class="actions"><button id="testAll">▷ 测试全部</button><button id="addModel" class="primary">＋ 添加模型</button></div></div>
<div class="metrics"><div><span>已配置模型</span><strong id="modelCount">0</strong></div><div><span>参与定时测试</span><strong id="enabledCount">0</strong></div><div><span>最近测速最快</span><strong id="fastest">—</strong></div><div><span>24 小时成功率</span><strong id="successRate">—</strong></div></div>
<div id="progress" class="banner hidden" role="status"></div>
<div class="toolbar"><div class="filters"><button class="active" data-filter="all">全部</button><button data-filter="chat">Chat Completions</button><button data-filter="responses">Responses</button><button data-filter="anthropic">Anthropic</button></div><input id="search" aria-label="搜索模型" placeholder="搜索名称或模型 ID…"></div><div id="cards" class="cards"></div><p class="note">端到端 tokens/s = 输出 token 数 ÷ 总耗时（含首字等待）。估算用量不触发排名通知。</p></section>
<section id="historyView" class="hidden"><div class="top"><div><h1>历史趋势</h1><p>按实际测试时间查看性能变化。</p></div><button id="clearHistory" class="quiet">清空历史记录</button></div><div class="history-controls"><label>模型<select id="historyModel"><option value="">全部模型</option></select></label><label>时间范围<select id="historyDays"><option value="1">最近 24 小时</option><option value="7" selected>最近 7 天</option><option value="30">最近 30 天</option><option value="90">最近 90 天</option><option value="3650">保留的全部历史</option></select></label><label>指标<select id="historyMetric"><option value="tokensPerSecond">端到端 tokens/s</option><option value="ttftMs">首字延迟（ms）</option><option value="totalMs">总耗时（ms）</option></select></label></div><div class="section"><h2 id="chartTitle">端到端输出速度</h2><div class="chart-wrap"><div id="chart" role="img"></div><p id="chartEmpty" class="empty chart-empty hidden">当前未选择模型。</p></div><p id="chartCaption" class="note"></p></div><details id="historyRecords" class="section history-records"><summary>测试记录 <span class="unit">最新 50 条 · 点击展开</span></summary><div id="historyRows"></div><p class="note">图表查询最多 3,000 条数据，记录仅展示最新 50 条；数据库保留策略不变。失败和取消不绘制为零速。</p></details></section>
<section id="notificationsView" class="hidden"><div class="top"><div><h1>通知记录</h1><p>排名变化与运行异常记录。</p></div><button id="clearNotifications" class="danger">清空全部</button></div><div id="notificationRows"></div></section>
<footer><span id="version">v0.0.0</span></footer></main>
<div class="toast hidden" id="toast" role="status"></div></body></html>
