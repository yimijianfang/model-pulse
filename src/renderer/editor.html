<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"><title>添加模型 · ModelPulse</title><link rel="stylesheet" href="styles.css"><script type="module" src="editor.js"></script></head><body class="editor-body"><div class="native-title" aria-hidden="true">ModelPulse</div><header class="editor-head"><div><h1 id="title">添加模型</h1><p>配置远程 API 连接，加入你的模型工作空间。</p></div><button id="cancelTop">取消</button></header><form id="modelForm" class="editor-form"><div class="editor-scroll"><div class="section"><div class="section-title"><span class="step">01</span><h2>接口与身份</h2></div><div class="protocols"><button type="button" data-protocol="chat" class="selected">OpenAI Chat Completions</button><button type="button" data-protocol="responses">OpenAI Responses</button><button type="button" data-protocol="anthropic">Anthropic Messages</button></div><div class="grid"><label class="field">显示名称 <input id="name" required maxlength="100" placeholder="例如：主力模型"></label><label class="field">模型 ID<input id="modelId" required maxlength="200" placeholder="服务商提供的模型标识"></label><label class="field wide">接口基础地址<input id="host" required type="url" placeholder="https://api.example.com/v1"><small>请求地址：<span id="endpointPreview">—</span></small></label><label class="field wide">API 密钥<div class="secret"><input id="apiKey" type="password" autocomplete="off" placeholder="输入 API 密钥"><button type="button" id="reveal">显示</button></div><small id="secretHint">密钥使用系统安全存储保护，不会出现在导出文件中。</small></label><label class="toggle wide hidden" id="clearSecretRow"><input type="checkbox" id="clearSecret">清除原有密钥及自定义请求头</label></div></div><div class="section"><div class="section-title"><span class="step">02</span><h2>测试与参数</h2></div><label class="toggle row"><input id="enabled" type="checkbox" checked>参与全局定时测试</label><p id="testDefaults" class="note"></p><p class="note">测试提示词、输出上限和超时统一在主窗口的运行设置中维护。</p><div class="grid"><label class="field">推理强度<select id="reasoning"><option value="">使用模型默认值</option><option value="low">低</option><option value="medium">中</option><option value="high">高</option></select><small id="reasoningHint">仅发送你明确选择的推理参数。</small></label><label class="field">上下文窗口（备注）<input id="context" type="number" min="1" max="100000000" placeholder="留空使用模型默认值"></label></div><details><summary>高级配置 · 额外参数与请求头</summary><div class="grid"><label class="field wide">额外参数 JSON<textarea id="extra" placeholder='{"temperature": 0}'></textarea><small>不能覆盖模型、流式开关、测试输入或输出上限。Chat 接口需支持 max_completion_tokens。</small></label><label class="field wide">自定义请求头 JSON<textarea id="headers" placeholder='{"X-Custom-Header": "value"}'></textarea><small>与 API 密钥一起加密保存。编辑时留空保留，填写 {} 清空请求头。</small></label></div></details><label class="field">备注<textarea id="notes" maxlength="2000" placeholder="用途、供应商或其他补充信息…"></textarea></label></div></div><footer class="editor-foot"><p id="error" class="error" role="alert"></p><div class="actions"><button id="cancel" type="button">取消</button><button name="action" value="save" type="submit">保存</button><button class="primary" name="action" value="test" type="submit">保存并测试</button></div></footer></form></body></html>
