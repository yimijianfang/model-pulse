<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"><title>设置计划 · ModelPulse</title><link rel="stylesheet" href="styles.css"><script type="module" src="schedule.js"></script></head><body class="editor-body preference-body"><div class="native-title" aria-hidden="true">ModelPulse</div><header class="editor-head"><div><h1>全局定时计划</h1><p>为所有已启用模型设置统一测试节奏。</p></div><button id="cancelTop">取消</button></header><form id="scheduleForm" class="editor-form"><div class="editor-scroll"><div class="section"><label class="toggle row"><input id="scheduleEnabled" type="checkbox">开启定时测试</label><div class="grid"><label class="field">执行频率<select id="frequency"><option value="hour">每小时</option><option value="interval">每隔几分钟</option><option value="day">每天</option><option value="week">每周</option><option value="custom">自定义 Cron</option></select></label><label class="field" id="minuteField">分钟<input id="minute" type="number" min="0" max="59" value="0"></label><label class="field hidden" id="hourField">小时<input id="hour" type="number" min="0" max="23" value="9"></label><label class="field hidden" id="intervalField">间隔分钟（1–59）<input id="interval" type="number" min="1" max="59" value="30"></label><label class="field hidden" id="weekField">星期<select id="week"><option value="1">星期一</option><option value="2">星期二</option><option value="3">星期三</option><option value="4">星期四</option><option value="5">星期五</option><option value="6">星期六</option><option value="0">星期日</option></select></label><label class="field wide">Cron 表达式<input id="cron" required placeholder="0 * * * *"><small>五段：分钟 小时 日期 月份 星期</small></label></div><p id="timezone" class="note"></p><h3>未来五次执行</h3><ol id="nextRuns" class="next-runs"></ol><p class="note">每轮串行执行，已有测试时跳过该次计划。失败请求不自动重试。</p></div></div><footer class="editor-foot"><p id="error" class="error" role="alert"></p><div class="actions"><button id="cancel" type="button">取消</button><button type="submit" class="primary">保存计划</button></div></footer></form></body></html>
