<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"><title>运行设置 · ModelPulse</title><link rel="stylesheet" href="styles.css"><script type="module" src="settings.js"></script></head><body class="editor-body preference-body"><div class="native-title" aria-hidden="true">ModelPulse</div><header class="editor-head"><div><h1>运行与测试设置</h1><p>统一管理测试参数、本机启动和系统通知。</p></div><button id="cancelTop">取消</button></header><form id="settingsForm" class="editor-form"><div class="editor-scroll"><div class="section"><label class="toggle row"><input type="checkbox" id="autoStart">开机启动</label><p id="autoStartHint" class="note"></p><label class="toggle row"><input type="checkbox" id="desktopNotifications">排名变化时发送系统通知</label><p class="note">关闭主窗口后驻留托盘继续运行。彻底退出或休眠时暂停，恢复后不补跑。</p></div><div class="section"><div class="grid"><label class="field">最大输出 tokens<input type="number" id="maxTokens" min="1" max="131072" required></label><label class="field">单次请求超时（秒）<input type="number" id="timeout" min="5" max="600" required></label><label class="field">历史保留（天）<input type="number" id="retentionDays" min="1" max="3650" required></label><label class="field wide">统一测试提示词<textarea id="prompt" required maxlength="16000"></textarea></label></div><p class="note">所有模型使用相同提示词与输出上限。</p><div class="actions import-export"><button type="button" id="exportConfig">导出配置</button><button type="button" id="importConfig">导入配置</button></div><p class="note">导出不含密钥或自定义请求头；导入模型默认不参与定时测试。</p></div></div><footer class="editor-foot"><p id="error" class="error" role="alert"></p><div class="actions"><button id="cancel" type="button">取消</button><button type="submit" class="primary">保存设置</button></div></footer></form></body></html>
